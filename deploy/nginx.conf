# Example nginx site for Mariáš Online running under systemd on 127.0.0.1:8000.
# Get a certificate first, e.g.:  certbot --nginx -d marias.example.cz

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name marias.example.cz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marias.example.cz;

    ssl_certificate     /etc/letsencrypt/live/marias.example.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marias.example.cz/privkey.pem;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
