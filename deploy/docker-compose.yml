# Mariáš Online behind Caddy with automatic HTTPS (Let's Encrypt).
#
#   1. Point your domain's DNS A/AAAA record to this server.
#   2. Put the domain into deploy/.env:   MARIAS_DOMAIN=marias.example.cz
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  marias:
    build: ..
    restart: unless-stopped
    environment:
      MARIAS_ALLOWED_ORIGINS: "https://${MARIAS_DOMAIN:?set MARIAS_DOMAIN}"
      MARIAS_HSTS: "true"
      # The app is not published; only Caddy on the private network reaches it,
      # so X-Forwarded-For can be trusted from any peer there.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [marias]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MARIAS_DOMAIN: "${MARIAS_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
