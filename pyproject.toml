[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marias-online"
version = "4.0.0"
description = "Licitovaný mariáš online podle pravidel Českého svazu mariáše"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.40,<1",
    "pydantic>=2.10,<3",
    "anyio>=4.6,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
marias-server = "marias.server.__main__:main"

[tool.setuptools.packages.find]
include = ["marias*"]

[tool.setuptools.package-data]
marias = ["web/**/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C4", "PT", "RET", "ARG"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # game rules are naturally branchy
    "RUF001", "RUF002", "RUF003",  # Czech text and typographic quotes are intentional
    "S311",  # tables get a SystemRandom; seeded Random is used only in tests and bots
    "S101",  # asserts narrow types for mypy on states the engine guarantees
    "PT018",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLC0415", "ARG", "PT011", "PT018", "B017", "S105", "S106", "PLR0912", "C901"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["marias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
